<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>むんきちゃんフォトコン</title>
  <style>
  :root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #111;
    color: #f5f5f5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #111;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("./wait-poster.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0.16;
    filter: blur(4px);
    transform: scale(1.05);
    z-index: -2;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.68) 0%,
        rgba(0, 0, 0, 0.78) 100%
      );
    z-index: -1;
  }

  main {
    width: min(560px, 100%);
    text-align: center;
    padding: 32px 24px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    background: rgba(24, 24, 24, 0.82);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
  }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(24px, 6vw, 36px);
    line-height: 1.3;
  }

  p {
    margin: 10px 0;
    line-height: 1.8;
    color: #d6d6d6;
  }

  .status {
    margin: 24px 0;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    font-weight: 700;
  }

  button, a.button {
    display: inline-block;
    margin-top: 14px;
    padding: 12px 18px;
    border: 1px solid #555;
    border-radius: 10px;
    background: #f5f5f5;
    color: #111;
    text-decoration: none;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  button:disabled {
    opacity: .55;
    cursor: default;
  }

  .small {
    margin-top: 18px;
    font-size: 12px;
    color: #aaa;
  }

  #tweetLink {
    display: none;
  }
</style>
</head>
<body>
  <main>
    <h1>むんきちゃんフォトコン</h1>
    <p id="message">公開状況を確認しています。</p>

    <div class="status" id="status">確認中…</div>

    <button id="checkButton" type="button">今すぐ再確認</button>
    <br>
    <a id="tweetLink" class="button" href="#" rel="noopener noreferrer">告知ポストを開く</a>

    <p class="small">
      告知公開後、このページからXの告知ポストへ移動します。
    </p>
  </main>

<script>
(() => {
  // GitHub上のリポジトリ名を変更した場合だけ、ここを修正してください。
  const GITHUB_OWNER = "N4NSY";
  const GITHUB_REPO  = "munki-photocon-link";
  const CONFIG_PATH  = "config.json";

  // GitHub APIの未認証レート制限を考慮し、自動確認は65秒間隔。
  const AUTO_CHECK_MS = 65000;

  const apiUrl =
    `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${CONFIG_PATH}?ref=main`;

  const messageEl = document.getElementById("message");
  const statusEl = document.getElementById("status");
  const checkButton = document.getElementById("checkButton");
  const tweetLink = document.getElementById("tweetLink");

  let checking = false;

  function isAllowedTweetUrl(url) {
    try {
      const u = new URL(url);
      return u.protocol === "https:" &&
        (u.hostname === "x.com" ||
         u.hostname === "www.x.com" ||
         u.hostname === "twitter.com" ||
         u.hostname === "www.twitter.com");
    } catch {
      return false;
    }
  }

  async function fetchConfigFromGitHub() {
    const res = await fetch(apiUrl + `&t=${Date.now()}`, {
      method: "GET",
      headers: {
        "Accept": "application/vnd.github.raw+json",
        "X-GitHub-Api-Version": "2026-03-10"
      },
      cache: "no-store"
    });
    if (!res.ok) throw new Error(`GitHub API: HTTP ${res.status}`);
    return JSON.parse(await res.text());
  }

  async function fetchConfigFallback() {
    const res = await fetch(`./config.json?t=${Date.now()}`, {
      cache: "no-store"
    });
    if (!res.ok) throw new Error(`Pages config: HTTP ${res.status}`);
    return await res.json();
  }

  async function getConfig() {
    try {
      return await fetchConfigFromGitHub();
    } catch (apiError) {
      console.warn(apiError);
      return await fetchConfigFallback();
    }
  }

  async function checkRelease() {
    if (checking) return;
    checking = true;
    checkButton.disabled = true;
    statusEl.textContent = "確認中…";

    try {
      const config = await getConfig();
      const released = config.released === true;
      const tweetUrl = typeof config.tweetUrl === "string" ? config.tweetUrl.trim() : "";
      const waitMessage =
        typeof config.message === "string" && config.message.trim()
          ? config.message.trim()
          : "フォトコンの詳細は集会終了後に公開します。";

      if (released && isAllowedTweetUrl(tweetUrl)) {
        messageEl.textContent = "告知を公開しました。Xへ移動します。";
        statusEl.textContent = "公開済み";
        tweetLink.href = tweetUrl;
        tweetLink.style.display = "inline-block";

        // 自動遷移。失敗しても手動リンクが残ります。
        setTimeout(() => {
          window.location.replace(tweetUrl);
        }, 700);
      } else {
        messageEl.textContent = waitMessage;
        statusEl.textContent = "まだ公開前です";
        tweetLink.style.display = "none";
      }
    } catch (e) {
      console.error(e);
      messageEl.textContent = "公開状況の取得に失敗しました。少し時間を置いて再確認してください。";
      statusEl.textContent = "取得エラー";
      tweetLink.style.display = "none";
    } finally {
      checking = false;
      checkButton.disabled = false;
    }
  }

  checkButton.addEventListener("click", checkRelease);
  checkRelease();
  setInterval(checkRelease, AUTO_CHECK_MS);
})();
</script>
</body>
</html>
